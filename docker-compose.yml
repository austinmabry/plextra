# Plextra — encrypted, GPU-accelerated, self-hosted media stack
#
# Start with:   ./scripts/start.sh     (unlocks the encrypted vault, then brings this up)
# Stop with:    ./scripts/stop.sh      (brings this down, then re-locks the vault)
#
# Do NOT `docker compose up` before the vault is unlocked — the containers
# would see empty mount points and create libraries in the wrong place.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: plextra-jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${RENDER_GID:-109}" # host 'render' group, needed for /dev/dri access
    environment:
      - TZ=${TZ:-UTC}
      - JELLYFIN_PublishedServerUrl=https://${JELLYFIN_HOST:-media.local}
      # NVIDIA hardware transcoding (requires nvidia-container-toolkit on the host)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      # Everything Jellyfin writes (metadata, watch state, DB) lives INSIDE the
      # encrypted vault, so it is protected at rest along with the media.
      - ${APPDATA_MOUNT:-${MEDIA_MOUNT}/appdata}/jellyfin/config:/config
      - ${APPDATA_MOUNT:-${MEDIA_MOUNT}/appdata}/jellyfin/cache:/cache
      - ${MEDIA_MOUNT}/media/movies:/media/movies:ro
      - ${MEDIA_MOUNT}/media/tv:/media/tv:ro
      - ${MEDIA_MOUNT}/media/music:/media/music:ro
      # Custom Plex-grade theme, served from the web root and pulled in via
      # the Custom CSS branding setting (seeded by scripts/setup.sh).
      - ./jellyfin/theme/theme.css:/jellyfin/jellyfin-web/theme.css:ro
      # Transcode scratch on fast local disk (tmpfs-like churn; not secret
      # long-term data, wiped on container restart).
      - jellyfin-transcodes:/config/transcodes
    devices:
      - /dev/dri:/dev/dri # falls back to VAAPI-capable path; harmless with NVENC
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - plextra
    expose:
      - "8096"
    ports:
      # Plain-HTTP on the LAN for TV apps (LG/webOS, some smart TVs) that
      # can't trust a private CA. LAN-only convenience — remote access still
      # goes through TLS/the mesh. Delete these two lines to disable.
      - "8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: plextra-books
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - AUDIOBOOKSHELF_UID=${PUID:-1000}
      - AUDIOBOOKSHELF_GID=${PGID:-1000}
    volumes:
      - ${APPDATA_MOUNT:-${MEDIA_MOUNT}/appdata}/audiobookshelf/config:/config
      - ${APPDATA_MOUNT:-${MEDIA_MOUNT}/appdata}/audiobookshelf/metadata:/metadata
      - ${MEDIA_MOUNT}/media/audiobooks:/audiobooks:ro
      - ${MEDIA_MOUNT}/media/ebooks:/ebooks:ro
    networks:
      - plextra
    expose:
      - "80"

  # ------------------------------------------------------------------
  # Requests: search everything, request what's missing (per-season for
  # TV), hand acquisition to your existing Radarr/Sonarr. Count quotas
  # (movies/seasons per window) are set per-user inside Jellyseerr;
  # quota-warden below adds MB-per-window budgets.
  # ------------------------------------------------------------------
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: plextra-requests
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - PORT=5055
    volumes:
      - ${APPDATA_MOUNT:-${MEDIA_MOUNT}/appdata}/jellyseerr:/app/config
    networks:
      - plextra
    expose:
      - "5055"
    depends_on:
      - jellyfin

  quota-warden:
    build: ./quota-warden
    container_name: plextra-quota-warden
    restart: unless-stopped
    environment:
      - JELLYSEERR_URL=http://jellyseerr:5055
      - JELLYSEERR_API_KEY=${JELLYSEERR_API_KEY:-}
      - RADARR_URL=${RADARR_URL:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - SONARR_URL=${SONARR_URL:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - CHECK_INTERVAL_SECONDS=300
    volumes:
      - ./quota-warden/quotas.yml:/etc/quota-warden/quotas.yml:ro
    networks:
      - plextra
    depends_on:
      - jellyseerr

  # ------------------------------------------------------------------
  # Built-in mesh VPN: this instance runs its own private tailnet.
  # headscale = self-hosted coordination server (+ embedded DERP relay
  # and STUN, so nothing depends on Tailscale Inc). The tailscale
  # sidecar joins THIS server to its own mesh, sharing Caddy's network
  # namespace so the tailnet IP serves the same TLS vhosts as the LAN.
  # Mesh state lives OUTSIDE the media vault on purpose: the VPN must
  # come up after a reboot even while the vault is still locked.
  # ------------------------------------------------------------------
  headscale:
    image: headscale/headscale:0.23
    container_name: plextra-headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/data:/var/lib/headscale
    networks:
      - plextra
    expose:
      - "8080"
    ports:
      - "3478:3478/udp" # STUN, for clients to discover direct paths

  tailscale:
    image: tailscale/tailscale:latest
    container_name: plextra-tailscale
    restart: unless-stopped
    hostname: plextra
    network_mode: service:caddy
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--login-server=http://headscale:8080 --accept-dns=false
      - TS_TAILSCALED_EXTRA_ARGS=--port=41641
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    depends_on:
      - headscale
      - caddy

  caddy:
    image: caddy:2-alpine
    container_name: plextra-caddy
    restart: unless-stopped
    environment:
      - JELLYFIN_HOST=${JELLYFIN_HOST:-media.local}
      - BOOKS_HOST=${BOOKS_HOST:-books.local}
      - REQUESTS_HOST=${REQUESTS_HOST:-requests.local}
      - MESH_HOST=${MESH_HOST:-mesh.example.com}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ${CADDYFILE:-./caddy/Caddyfile.lan}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
      - "41641:41641/udp" # WireGuard for the tailscale sidecar (shared netns)
    networks:
      - plextra
    depends_on:
      - jellyfin
      - audiobookshelf

networks:
  plextra:
    driver: bridge

volumes:
  jellyfin-transcodes:
  caddy-data:
  caddy-config:
  tailscale-state:
